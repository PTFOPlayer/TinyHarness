[package]
name = "tinyharness-ui"
version = "0.5.0"
license = "MIT"
description = "Terminal UI library for TinyHarness: ANSI output, prompts and diff display"
edition = "2024"
repository = "https://github.com/PTFOPlayer/TinyHarness"
homepage = "https://github.com/PTFOPlayer/TinyHarness"
documentation = "https://docs.rs/tinyharness-ui"
keywords = ["tui", "cli", "ansi", "rustyline", "terminal"]
categories = ["command-line-interface"]

[dependencies]
tinyharness-lib = { version = "0.5.0", path = "../tinyharness-lib" }
rustyline = { version = "18.0.0", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.11.1"
