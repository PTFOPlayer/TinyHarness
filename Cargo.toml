[workspace]
members = [".", "tinyharness-lib", "tinyharness-ui"]

[package]
name = "TinyHarness"
version = "0.5.0"
license = "MIT"
description = "TinyHarness - AI coding harness with pluggable LLM providers and built-in tool calling"
edition = "2024"
repository = "https://github.com/PTFOPlayer/TinyHarness"
homepage = "https://github.com/PTFOPlayer/TinyHarness"
readme = "README.md"
keywords = ["ai", "agent", "cli", "llm", "coding-assistant"]
categories = ["command-line-utilities"]

[[bin]]
name = "tinyharness"
path = "src/main.rs"

[dependencies]
tinyharness-lib = { version = "0.5.0", path = "tinyharness-lib" }
tinyharness-ui = { version = "0.5.0", path = "tinyharness-ui" }
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.11.1"
rustyline = { version = "18.0.0", features = ["derive"] }
ctrlc = "3"
chrono = "0.4.42"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tinyharness-lib = { version = "0.5.0", path = "tinyharness-lib", features = ["test-util"] }
tempfile = "3"
proptest = "1"

[profile.release]
strip = true
lto = true